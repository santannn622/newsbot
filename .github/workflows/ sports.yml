name: Sports bots

on:
  schedule:
    - cron: "10 8,14,20 * * *"   # sports Shorts, UTC: 08:10, 14:10, 20:10
    - cron: "0 19 * * *"         # daily sports video, UTC: 19:00
  workflow_dispatch:             # run by hand: pick what to make
    inputs:
      which:
        description: "What should it make?"
        type: choice
        options:
          - shorts
          - daily
        default: shorts

permissions:
  contents: write

jobs:
  sports-short:
    if: "${{ (github.event_name == 'schedule' && github.event.schedule == '10 8,14,20 * * *') || (github.event_name == 'workflow_dispatch' && inputs.which == 'shorts') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: sports-shorts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Make a sports Short and send it to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python news_bot.py shorts --topic sports

      - name: Save the bot's memory
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state_sports_shorts.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update sports bot memory"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi

  sports-video:
    if: "${{ (github.event_name == 'schedule' && github.event.schedule == '0 19 * * *') || (github.event_name == 'workflow_dispatch' && inputs.which == 'daily') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: sports-daily
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Make the daily sports video and send it to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python news_bot.py daily --topic sports

      - name: Keep the full-quality video for download (3 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: daily-sports-video
          path: |
            output/sportsroundup*.mp4
            output/*_thumb.jpg
          retention-days: 3
          if-no-files-found: ignore

      - name: Save the bot's memory
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state_sports_daily.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update sports bot memory"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi
