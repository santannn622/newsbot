name: Shorts bot

on:
  schedule:
    - cron: "15 6,12,18 * * *"   # times are UTC: 06:15, 12:15, 18:15
  workflow_dispatch:             # lets you run it by hand with a button

permissions:
  contents: write

concurrency:
  group: shorts-bot
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-base-en

      - name: Make a Short and send it to Telegram
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python news_bot.py shorts

      - name: Save the bot's memory
        if: always()
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state_shorts.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Update bot memory"
            for i in 1 2 3; do git pull --rebase && git push && break || sleep 5; done
          fi
